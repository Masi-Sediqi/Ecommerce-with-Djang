# 📄 Custom File Title
<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  </head>
  <body class="bg-gray-100">
    <nav class="flex items-center justify-between px-6 py-4 bg-white shadow-lg border border-gray-300 rounded-xl">
      <!-- Left: Logo -->
      <div class="flex items-center space-x-2">
        <img src="https://miro.medium.com/v2/resize:fit:1200/1*F1FiwQYn1KnKjk_a6wo0yw.png" alt="Logo" class=" w-12 h-12 object-contain" />
        <a href="/" class="text-1xl font-bold text-gray-800 -mt-1">Django + Tailwind</a>
      </div>
      

      <!-- Center: Navigation Links -->
      <div class="flex space-x-4 text-xl font-semibold">
        <a href="/dashboard" class="px-3 py-2 text-gray-700 hover:bg-gray-100 hover:text-gray-900 rounded-lg">Home</a>
        <a href="/team" class="px-3 py-2 text-gray-700 hover:bg-gray-100 hover:text-gray-900 rounded-lg">Team</a>
        <a href="/projects" class="px-3 py-2 text-gray-700 hover:bg-gray-100 hover:text-gray-900 rounded-lg">Projects</a>
        <a href="/reports" class="px-3 py-2 text-gray-700 hover:bg-gray-100 hover:text-gray-900 rounded-lg">Reports</a>
      </div>

      <!-- Right: Icons and Profile -->
      <div class="flex items-center space-x-10">
        <!-- Search -->
        <div x-data="{ open: false }" class="relative">
          <button @click="open = !open; $nextTick(() => $refs.search?.focus())" class="text-gray-600 hover:text-gray-800">
            <!-- Search icon -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
              stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M21 21l-4.35-4.35M17 10.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0z" />
            </svg>
          </button>

          <div x-show="open" @click.away="open = false" x-transition
            class="absolute right-0 mt-2 w-64 bg-white border border-gray-200 rounded-lg shadow-lg z-50 p-2">
            <input x-ref="search" type="text" placeholder="Search..."
              class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400" />
          </div>
        </div>

        <!-- Cart Icon -->
        <a href="/cart" class="text-gray-600 hover:text-gray-800 relative">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13l-1.5 6h13L17 13M7 13h10m-6 8a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm6 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0z" />
          </svg>
          <!-- Cart count badge (optional) -->
          <span
            class="absolute top-0 right-0 inline-block w-4 h-4 text-xs leading-4 text-center text-white bg-red-600 rounded-full">3</span>
        </a>

        <!-- User Profile -->
        <div class="relative" x-data="{ open: false }">
          <button @click="open = !open" class="focus:outline-none">
            <img src="https://i.pravatar.cc/40" alt="Profile"
              class="w-10 h-10 rounded-full border-2 border-gray-300" />
          </button>
          <div x-show="open" @click.away="open = false" x-transition
            class="absolute right-0 mt-2 w-48 bg-white border border-gray-200 rounded-lg shadow-lg z-50">
            <a href="/profile" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Profile</a>
            <a href="/settings" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Settings</a>
            <a href="/logout" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Logout</a>
          </div>
        </div>
      </div>
    </nav>

    <main class="p-6">
      <h1 class="text-3xl font-bold underline">Hello world!</h1>
    </main>
  </body>
</html>
